<form action="" method="POST" class="d-inline-block">
  <input type="hidden" name="csrf" value="[[csrf]]">
  {{IF [[autorefresh]] > 0}}
    <input type='hidden' name='toggleautorefresh' value='Off'>
    <button type="submit" class='btn btn-warning btn-sm' data-bs-toggle="tooltip" data-bs-placement="top" title="Disable auto-refresh">
      <i class="fas fa-pause"></i> Turn off auto-reload
    </button>
  {{ELSE}}
    <input type='hidden' name='toggleautorefresh' value='On'>
    <button type="submit" class='btn btn-success btn-sm' data-bs-toggle="tooltip" data-bs-placement="top" title="Enable auto-refresh">
      <i class="fas fa-play"></i> Turn on auto-reload
    </button>
  {{ENDIF}}
</form>
