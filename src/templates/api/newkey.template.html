{%TEMPLATE->struct/head%}
{%TEMPLATE->struct/menu%}

<h2>New API Key</h2>
{%TEMPLATE->struct/messages%}

<form action='api.php?newkey=true' method='post'>
  <input type='hidden' name='action' value='[[$DApiAction::CREATE_KEY]]'>
  <input type="hidden" name="csrf" value="[[csrf]]">
  
  <div class="card">
    <div class="card-body">
      <div class="mb-3">
        <label for="userId" class="form-label"><strong>User</strong></label>
        <select class="form-select" id="userId" name="userId" title="User">
          <option value="">---</option>
          {{FOREACH user;[[users]]}}
            <option value="[[user.getId()]]">[[user.getUsername()]]</option>
          {{ENDFOREACH}}
        </select>
      </div>

      <div class="mb-3">
        <label for="groupId" class="form-label"><strong>API Access Group</strong></label>
        <select class="form-select" id="groupId" name="groupId" title="API Access Group">
          <option value="">---</option>
          {{FOREACH group;[[groups]]}}
            <option value="[[group.getId()]]">[[group.getName()]]</option>
          {{ENDFOREACH}}
        </select>
      </div>

      <button type='submit' class='btn btn-success'>Create</button>
    </div>
  </div>
</form>

{%TEMPLATE->struct/foot%}
