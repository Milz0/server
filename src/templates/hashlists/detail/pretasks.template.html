{{IF [[accessControl.hasPermission([[$DAccessControl::RUN_TASK_ACCESS]])]]}}
  <h3>Create pre-configured tasks:</h3>
  
  <form id="preconf" action="hashlists.php?id=[[list.getVal('hashlist')->getId()]]" method="POST">
    <input type='hidden' name='action' value='[[$DHashlistAction::APPLY_PRECONFIGURED_TASKS]]'>
    <input type="hidden" name="hashlist" value="[[list.getVal('hashlist')->getId()]]">
    <input type="hidden" name="csrf" value="[[csrf]]">
    
    <div class="card">
      <div class="table-responsive">
        <table class="table table-bordered mb-0">
          <thead>
            <tr>
              <th style="width: 10%;">ID</th>
              <th style="width: 10%;">Color</th>
              <th style="width: 80%;">Name</th>
            </tr>
          </thead>
          <tbody>
            {{FOREACH task;[[preTasks]]}}
              <tr>
                <td>
                  <a href="tasks.php?id=[[task.getId()]]">[[task.getId()]]</a>
                </td>
                <td{{IF [[strlen([[task.getColor()]])]] > 0}} style="background-color: #[[task.getColor()]]; height: 20px;"{{ENDIF}}>
                  &nbsp;
                </td>
                <td>
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="task[]" id="task_[[task.getId()]]" value="[[task.getId()]]" title="Task Selection">
                    <label class="form-check-label" for="task_[[task.getId()]]">
                      <a href="pretasks.php?id=[[task.getId()]]" title="[[htmlentities([[task.getAttackCmd()]], ENT_QUOTES, "UTF-8")]]">[[task.getTaskName()]]</a>
                    </label>
                  </div>
                </td>
              </tr>
            {{ENDFOREACH}}
            <tr>
              <td colspan="3">
                <div class="d-flex justify-content-between align-items-center">
                  <button type="submit" class='btn btn-primary'>Create</button>
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="selectAll" onChange="checkAll('preconf', this.checked);" title="Check All">
                    <label class="form-check-label" for="selectAll">
                      Select All
                    </label>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </form>
{{ENDIF}}
