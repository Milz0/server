  <!-- Bootswatch Darkly v5.3.0 -->

  <!-- DataTables v1.13.7 Bootstrap 5 -->
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">

  <link href="static/select2.min.css" rel="stylesheet" type="text/css">

  <style>
  /* DataTables wrapper padding */
  .dataTables_wrapper {
    padding: 1rem;
  }

  /* DataTables controls spacing */
  .dataTables_length,
  .dataTables_filter {
    margin-bottom: 1rem;
  }

  .dataTables_info,
  .dataTables_paginate {
    margin-top: 1rem;
  }

  /* Mobile adjustments */
  @media (max-width: 575px) {
    .dataTables_wrapper {
      padding: 0.5rem;
    }

    .dataTables_length,
    .dataTables_filter {
      margin-bottom: 0.75rem;
    }

    .dataTables_info,
    .dataTables_paginate {
      margin-top: 0.75rem;
    }
  }
</style>

  <style>
    /* Select2 Responsive Width Adjustments */
    /* X-Small devices (portrait phones, less than 576px) */
    .select2-selection__rendered {
      max-width: 49vw;
    }
    
    /* Small devices (landscape phones, 576px and up) */
    @media (min-width: 576px) {
      .select2-selection__rendered {
        max-width: 46vw;
      }
    }

    /* Medium devices (tablets, 768px and up) */
    @media (min-width: 768px) {
      .select2-selection__rendered {
        max-width: 50vw;
      }
    }

    /* Large devices (desktops, 992px and up) */
    @media (min-width: 992px) {
      .select2-selection__rendered {
        max-width: 54vw;
      }
    }

    /* X-Large devices (large desktops, 1200px and up) */
    @media (min-width: 1200px) {
      .select2-selection__rendered {
        max-width: 68vw;
      }
    }

    /* XX-Large devices (larger desktops, 1400px and up) */
    @media (min-width: 1400px) {
      .select2-selection__rendered {
        max-width: 64vw;
      }
    }
  </style>

  <!-- External Libraries -->
  <script type="text/javascript" src="jscolor/jscolor.js"></script>
  <script src="static/jquery.min.js"></script>
  <script src="static/js.cookie.min.js"></script>
  
  <!-- Bootstrap 5.3.0 Bundle (includes Popper.js) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js -->
  <script src="static/chartjs.bundle.min.js"></script>

  <!-- DataTables v1.13.7 Bootstrap 5 -->
  <script type="text/javascript" src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script type="text/javascript" src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script type="text/javascript" src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script type="text/javascript" src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

  <!-- Select2 -->
  <script type="text/javascript" src="static/select2.min.js"></script>

  {{IF [[autorefresh]] > 0}}
  <meta http-equiv="refresh"
    content="[[autorefresh]]{{IF [[strlen([[autorefreshUrl]])]] > 0}}; URL=[[autorefreshUrl]]{{ENDIF}}">
  {{ENDIF}}

  <script type='text/javascript'>
    // Set Select2 default theme to Bootstrap 5
    $.fn.select2.defaults.set("theme", "bootstrap-5");

    // Initialize DataTables with Bootstrap 5 defaults
    $.extend($.fn.dataTable.defaults, {
      language: {
        search: "_INPUT_",
        searchPlaceholder: "Search...",
        lengthMenu: "Show _MENU_ entries",
        info: "Showing _START_ to _END_ of _TOTAL_ entries",
        infoEmpty: "No entries to show",
        infoFiltered: "(filtered from _MAX_ total entries)",
        paginate: {
          first: '<i class="fas fa-chevron-left"></i><i class="fas fa-chevron-left"></i>',
          previous: '<i class="fas fa-chevron-left"></i>',
          next: '<i class="fas fa-chevron-right"></i>',
          last: '<i class="fas fa-chevron-right"></i><i class="fas fa-chevron-right"></i>'
        }
      },
      dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>' +
           '<"row"<"col-sm-12"tr>>' +
           '<"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
      responsive: true,
      autoWidth: false
    });

    // Form utility functions
    function sourceChange(value) {
      const pasteObject = document.getElementById("pasteLine");
      const uploadObject = document.getElementById("uploadLine");
      const importObject = document.getElementById("importLine");
      const downloadObject = document.getElementById("downloadLine");

      // Hide all first
      if (pasteObject) pasteObject.style.display = 'none';
      if (uploadObject) uploadObject.style.display = 'none';
      if (importObject) importObject.style.display = 'none';
      if (downloadObject) downloadObject.style.display = 'none';

      // Show selected
      switch (value) {
        case 'paste':
          if (pasteObject) pasteObject.style.display = '';
          break;
        case 'upload':
          if (uploadObject) uploadObject.style.display = '';
          break;
        case 'import':
          if (importObject) importObject.style.display = '';
          break;
        case 'url':
          if (downloadObject) downloadObject.style.display = '';
          break;
      }
    }

    function checkAll(formname, checktoggle) {
      const checkboxes = document.getElementById(formname).getElementsByTagName('input');
      for (let i = 0; i < checkboxes.length; i++) {
        if (checkboxes[i].type === 'checkbox') {
          checkboxes[i].checked = checktoggle;
        }
      }
    }
  </script>
</head>
