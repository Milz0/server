{%TEMPLATE->struct/head%}
{%TEMPLATE->struct/menu%}
<h2>Forgot password</h2>
{%TEMPLATE->struct/messages%}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body p-5">
          <form action='forgot.php' method='post'>
            <input type='hidden' name='action' value='[[$DForgotAction::RESET]]'>
            <input type="hidden" name="csrf" value="[[csrf]]">
            
            <div class="mb-4">
              <label for="inputUsername" class="form-label">Username</label>
              <input name='username' type="text" class="form-control form-control-lg" id="inputUsername" placeholder="Enter your username" required>
            </div>
            
            <div class="mb-4">
              <label for="inputEmail" class="form-label">Email</label>
              <input name='email' type="email" class="form-control form-control-lg" id="inputEmail" placeholder="Enter your email address" required>
            </div>
            
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-paper-plane" aria-hidden="true"></i> Send new password
              </button>
            </div>
          </form>
        </div>
      </div>
      
      <div class="text-center mt-4">
        <p class="text-muted">
          Remember your password? <a href="login.php">Back to login</a>
        </p>
      </div>
    </div>
  </div>
</div>

{%TEMPLATE->struct/foot%}
