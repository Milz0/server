<!-- My Instances Tab -->
<div class="tab-pane fade" id="instances" role="tabpanel">
  <div class="card">
    <div class="card-header bg-light">
      <h5 class="mb-0"><i class="fas fa-server mr-2"></i>Active Instances</h5>
    </div>
    <div class="card-body">
      <!-- Account Balance Section -->
      <div id="accountBalanceSection" class="mb-3" style="display: none;">
        <div class="card border-primary">
          <div class="card-body bg-light py-3">
            <div class="row text-center">
              <div class="col-md-4 border-right">
                <div class="mb-1">
                  <i class="fas fa-wallet text-primary fa-2x"></i>
                </div>
                <h6 class="text-muted mb-1">Account Balance</h6>
                <h4 id="accountBalance" class="mb-0 text-primary">Loading...</h4>
              </div>
              <div class="col-md-4 border-right">
                <div class="mb-1">
                  <i class="fas fa-tachometer-alt text-warning fa-2x"></i>
                </div>
                <h6 class="text-muted mb-1">Current Cost</h6>
                <h4 id="currentHourlyCost" class="mb-0 text-warning">$0.000/hr</h4>
              </div>
              <div class="col-md-4">
                <div class="mb-1">
                  <i class="fas fa-hourglass-half text-success fa-2x"></i>
                </div>
                <h6 class="text-muted mb-1">Estimated Runtime</h6>
                <h4 id="runtimeEstimate" class="mb-0">N/A</h4>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bulk Actions -->
      <div class="mb-3">
        <button id="bulkDestroyBtn" class="btn btn-danger btn-sm" style="display: none;">
          <i class="fas fa-trash-alt"></i> Destroy Selected (<span id="selectedInstancesCount">0</span>)
        </button>
        <button id="loadInstancesBtn" class="btn btn-primary btn-sm float-right mb-3" {{IF [[vastConfigured]]==0}}disabled{{ENDIF}}>
          <i class="fas fa-sync-alt"></i> Refresh Instances
        </button>
      </div>

      <!-- Loading/Error States -->
      <div id="instancesLoading" class="text-center py-5" style="display: none;">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading instances...</p>
      </div>

      <div id="instancesError" class="alert alert-danger" style="display: none;"></div>

      <!-- Instances Table Container -->
      <div id="instancesContainer"></div>
    </div>
  </div>
</div>
