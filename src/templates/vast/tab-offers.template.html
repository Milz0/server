<!-- Browse Offers Tab -->
<div class="tab-pane fade show active" id="offers" role="tabpanel">
  <div class="card">
    <div class="card-header bg-light">
      <h5 class="mb-0"><i class="fas fa-search mr-2"></i>Available GPU Offers</h5>
    </div>
    <div class="card-body">
      <!-- Filter Section -->
      <div class="row mb-3">
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-globe"></i> Continent</label>
          <select class="form-control form-control-sm" id="continentFilter">
            <option value="" selected>All Continents</option>
            <option value="North America">North America</option>
            <option value="South America">South America</option>
            <option value="Europe">Europe</option>
            <option value="Asia">Asia</option>
            <option value="Africa">Africa</option>
            <option value="Oceania">Oceania</option>
          </select>
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-microchip"></i> GPU Type</label>
          <input type="text" class="form-control form-control-sm" id="gpuFilter" placeholder="e.g., RTX 5090">
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-hashtag"></i> Min GPU Count</label>
          <input type="number" class="form-control form-control-sm" id="minGpuCount" min="1" placeholder="1">
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-dollar-sign"></i> Max Price ($/hr)</label>
          <input type="number" class="form-control form-control-sm" id="maxPrice" step="0.1" placeholder="Any">
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-star"></i> Min Reliability (%)</label>
          <input type="number" class="form-control form-control-sm" id="minReliability" min="0" max="100" value="95">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-sort"></i> Sort By</label>
          <select class="form-control form-control-sm" id="sortBy">
            <option value="dph_total_asc">Price: Low to High</option>
            <option value="dph_total_desc">Price: High to Low</option>
            <option value="num_gpus_desc">GPU Count: High to Low</option>
            <option value="num_gpus_asc">GPU Count: Low to High</option>
            <option value="flops_per_dphtotal_desc" selected>Performance/$ (FLOPS): High to Low</option>
            <option value="flops_per_dphtotal_asc">Performance/$ (FLOPS): Low to High</option>
            <option value="inet_down_desc">Download Speed: High to Low</option>
            <option value="inet_down_asc">Download Speed: Low to High</option>
            <option value="inet_up_desc">Upload Speed: High to Low</option>
            <option value="inet_up_asc">Upload Speed: Low to High</option>
            <option value="reliability_desc">Reliability: High to Low</option>
            <option value="reliability_asc">Reliability: Low to High</option>
          </select>
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-list-ol"></i> API Limit</label>
          <select class="form-control form-control-sm" id="offerLimit">
            <option value="50">50 offers</option>
            <option value="100">100 offers</option>
            <option value="200" selected>200 offers</option>
            <option value="500">500 offers</option>
            <option value="1000">1000 offers (max)</option>
          </select>
          <div class="custom-control custom-checkbox mt-1">
            <input type="checkbox" class="custom-control-input" id="loadAllOffers">
            <label class="custom-control-label small text-muted" for="loadAllOffers">
              <i class="fas fa-infinity"></i> Load All (1000 max)
            </label>
          </div>
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1"><i class="fas fa-table"></i> Per Page</label>
          <select class="form-control form-control-sm" id="offersPerPage">
            <option value="25">25 per page</option>
            <option value="50" selected>50 per page</option>
            <option value="100">100 per page</option>
            <option value="200">200 per page</option>
          </select>
        </div>
        <div class="col-md-2 mb-2">
          <label class="text-muted small mb-1">&nbsp;</label>
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="datacenterOnly">
            <label class="custom-control-label" for="datacenterOnly">
              <i class="fas fa-building"></i> Datacenter Only
            </label>
          </div>
        </div>
        <div class="col-md-3 mb-2">
          <label class="text-muted small mb-1">&nbsp;</label>
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="includeUnverified">
            <label class="custom-control-label" for="includeUnverified">
              <i class="fas fa-shield-alt"></i> Include Unverified
            </label>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-12">
          <button class="btn btn-primary btn-sm" id="loadOffersBtn" {{IF [[vastConfigured]]==0}}disabled{{ENDIF}}>
            <i class="fas fa-search"></i> Search Offers
          </button>
          <button class="btn btn-secondary btn-sm ml-2" id="clearFiltersBtn">
            <i class="fas fa-times"></i> Clear Filters
          </button>
          <button class="btn btn-success btn-sm ml-3" id="bulkRentBtn" style="display: none;">
            <i class="fas fa-plus-circle"></i> Rent Selected (<span id="selectedOffersCount">0</span>)
          </button>
          <span class="ml-3 text-muted" id="offerCount"></span>
        </div>
      </div>

      <div id="offersLoading" class="text-center py-5" style="display: none;">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading offers...</p>
      </div>
      
      <div id="offersError" class="alert alert-danger" style="display: none;"></div>
      <div id="offersContainer"></div>
      
      <!-- Pagination Container -->
      <div id="paginationContainer" class="mt-3"></div>
    </div>
  </div>
</div>
