version: '3.7'
services:
  hashtopolis-backend:
    container_name: hashtopolis-backend
    image: hashtopolis/backend:vast
    restart: always
    volumes:
      - hashtopolis:/usr/local/share/hashtopolis:Z
    environment:
      HASHTOPOLIS_DB_USER: ${MYSQL_USER:-hashtopolis}
      HASHTOPOLIS_DB_PASS: ${MYSQL_PASSWORD:-hashtopolis}
      HASHTOPOLIS_DB_HOST: ${HASHTOPOLIS_DB_HOST:-db}
      HASHTOPOLIS_DB_DATABASE: ${MYSQL_DATABASE:-hashtopolis}
      HASHTOPOLIS_ADMIN_USER: $HASHTOPOLIS_ADMIN_USER
      HASHTOPOLIS_ADMIN_PASSWORD: $HASHTOPOLIS_ADMIN_PASSWORD
      HASHTOPOLIS_APIV2_ENABLE: $HASHTOPOLIS_APIV2_ENABLE
    ports:
      - 8080:80
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    container_name: hashtopolis-db
    image: mysql:8.0
    restart: always
    volumes:
      - db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASS
      MYSQL_DATABASE: $MYSQL_DATABASE
      MYSQL_USER: $MYSQL_USER
      MYSQL_PASSWORD: $MYSQL_PASSWORD
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    profiles:
      - local-db

  hashtopolis-frontend:
    container_name: hashtopolis-frontend
    image: hashtopolis/frontend:vast
    environment:
      HASHTOPOLIS_BACKEND_URL: $HASHTOPOLIS_BACKEND_URL
    restart: always
    depends_on:
      - hashtopolis-backend
    ports:
      - 4200:80

volumes:
  db:
  hashtopolis:
